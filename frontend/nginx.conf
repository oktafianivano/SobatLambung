server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolve nama service Docker saat request berjalan (bukan saat start),
    # sehingga image frontend tetap bisa dipakai tanpa service "backend".
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $backend_upstream http://backend:8000;

    # Same-origin API: cookie autentikasi menjadi first-party sehingga
    # tidak diblokir browser dan tetap terkirim setelah refresh halaman.
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    location = /health {
        proxy_pass $backend_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File hasil build punya hash di nama → aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: semua rute diarahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
