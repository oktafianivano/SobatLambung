name: sobat-lambung

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Production defaults; nilai di backend/.env tetap menimpa default ini
      # kecuali variabel di bawah (environment menang atas env_file).
      APP_ENV: ${APP_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-auto}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Kosong = same-origin. Nginx meneruskan /api ke service backend,
        # sehingga cookie login tetap first-party dan tidak hilang saat refresh.
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "3000:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      NGINX_RESOLVER: ${NGINX_RESOLVER:-127.0.0.11 ipv6=off}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
